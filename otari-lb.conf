# otari-lb (docker-compose.scale.yml): spreads requests over every Otari replica.
# `otari` and `otari-replica` resolve, when nginx starts, to every container of
# each service, so each one is its own upstream server.
upstream otari {
    server otari:8000;
    server otari-replica:8000;
    keepalive 64;
}

# The serving replica of each request, for concurrency.py.
log_format replica '$upstream_addr $status $request_method $uri';

server {
    listen 8000;
    access_log /var/log/otari-lb/access.log replica;

    location / {
        proxy_pass http://otari;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Streamed completions go out as they arrive.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
