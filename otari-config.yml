# Otari for the local pilot (pilot.md section 5): real Vertex, Mistral, Exa and
# Liner; fakes.py stands in for the provider failures the checks need. The otari
# service in docker-compose.yml reads MISTRAL_API_KEY, EXA_API_KEY, LINER_API_KEY
# and VERTEX_PROJECT from .env, and mounts the Vertex service
# account key at VERTEX_CREDENTIALS (default state/vertex-sa.json). Its image listens on 8000
# (OTARI_HOST and OTARI_PORT), which Compose publishes as 127.0.0.1:8100.
# MLPA's budgets and service key are declared at the end, and applied at every start.

database_url: "postgresql://otari:otari@postgres:5432/otari"
master_key: ${OTARI_MASTER_KEY}
auto_migrate: true
default_pricing: false
require_pricing: true
files_provider_upload_enabled: false

rate_limit_store: redis
rate_limit_redis_url: "redis://redis:6379/0"

providers:
  # Named vertex_ai, LiteLLM's prefix, so the LiteLLM model names MLPA and the eval
  # harness send (vertex_ai/mistral-small-2503) resolve as instance/model. Qwen is
  # served from us-south1, as in MLPA's LiteLLM config.
  vertex_ai:                      # real
    provider_type: vertexai
    credentials: /rig/vertex-sa.json
    project: ${VERTEX_PROJECT}
    location: us-south1
    models: [qwen/qwen3-235b-a22b-instruct-2507-maas, mistral-small-2503]
  vertex_global:                  # real; Gemini 3.1 Flash Lite is only served globally
    provider_type: vertexai
    credentials: /rig/vertex-sa.json
    project: ${VERTEX_PROJECT}
    location: global
    models: [gemini-3.1-flash-lite]
  vertex_fake:                    # fakes.py: a provider 429 and a context-length refusal
    provider_type: openai
    api_base: "http://fakes:9100/vertexai"
    api_key: fake
    models: [gemini-2.5-flash-lite-429, gemini-2.5-flash-lite-tiny-context, per-request, spill-primary, spill-secondary, fast]
  # MLPA's load tests (LiteLLM's mock_response under Otari): a fake that answers
  # after a fixed delay, with no SDK retries, as Otari's own load test does.
  loadtest:
    provider_type: openai
    api_base: "http://fakes:9100/mock"
    api_key: fake
    models: [mock]
    max_retries: 0
  mistral:                        # real
    api_key: ${MISTRAL_API_KEY}
    models: [mistral-small-2603]
  exa_answers:                    # real
    provider_type: openai
    api_base: "https://api.exa.ai"
    api_key: ${EXA_API_KEY}
    models: [exa]
  liner_answers:                  # real; Liner's quick-answer agent, citations from its references
    provider_type: liner
    api_key: ${LINER_API_KEY}
    models: [quick-answer]

# The bare names clients send through MLPA (Remote Settings, Android, iOS).
# An alias cannot contain '/', which is why the vertex instance carries the prefix.
aliases:
  gemini-3.1-flash-lite: vertex_global:gemini-3.1-flash-lite
  moz-summarization: vertex_global:gemini-3.1-flash-lite
  throttled: vertex_fake:gemini-2.5-flash-lite-429
  tiny-context: vertex_fake:gemini-2.5-flash-lite-tiny-context
  per-request: vertex_fake:per-request
  fake-chat: vertex_fake:fast
  mistral-small-2603: mistral:mistral-small-2603
  exa: exa_answers:exa
  liner: liner_answers:quick-answer   # the model MLPA sends for liner-answer
  mock: loadtest:mock

pricing:
  vertex_global:gemini-3.1-flash-lite: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  vertex_ai:qwen/qwen3-235b-a22b-instruct-2507-maas: {input_price_per_million: 0.22, output_price_per_million: 0.88}
  vertex_ai:mistral-small-2503: {input_price_per_million: 0.10, output_price_per_million: 0.30}
  vertex_fake:gemini-2.5-flash-lite-429: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  # $0.005 a request, like an Exa answer, for check.py's spent-budget refusal.
  vertex_fake:spill-primary: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  vertex_fake:spill-secondary: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  vertex_fake:fast: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  vertex_fake:per-request: {input_price_per_million: 5000.0, output_price_per_million: 0.0, unit: requests}
  vertex_fake:gemini-2.5-flash-lite-tiny-context: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  loadtest:mock: {input_price_per_million: 0.10, output_price_per_million: 0.40}
  mistral:mistral-small-2603: {input_price_per_million: 0.10, output_price_per_million: 0.30}
  # Exa bills answers per request ($0.005), and reports no token usage.
  exa_answers:exa: {input_price_per_million: 5000.0, output_price_per_million: 0.0, unit: requests}
  # Liner bills each answer ($0.003), whatever its length.
  liner_answers:quick-answer: {input_price_per_million: 3000.0, output_price_per_million: 0.0, unit: requests}
  # Exa search is billed at the cost Exa reports with each result. This flat rate,
  # $5 per 1,000 requests (USD per million requests), is what Otari reserves up
  # front and charges when Exa reports none.
  exa:exa-search: {input_price_per_million: 5000.0, output_price_per_million: 0.0, unit: requests}

# Overflow (pilot-2.md: "Model 1 handles 100% of traffic up to 100 RPM, after
# which traffic spills over to Model 2"). A per-model limit counts every request
# that reaches the model, in Redis, so it holds across replicas; a priority
# policy skips a full model without calling it and tries the next. The rule is
# the toggle: remove it, and Qwen never fills up, so nothing spills.
# (routing.enabled: false would also stop it, but turns every policy off, and
# with them the Qwen name clients send.)
rate_limits:
  - name: qwen-overflow
    per: model
    models: ["vertex_ai:qwen/qwen3-235b-a22b-instruct-2507-maas"]
    rpm: 100
  # check.py's overflow check, on fakes: the primary is full after 3 a minute.
  - name: spill-primary-cap
    per: model
    models: ["vertex_fake:spill-primary"]
    rpm: 3

# The name clients send for Qwen is a policy rather than an alias:
# - past 100 requests a minute, Qwen is full and Gemini takes the rest;
# - a failure before any response is sent (a 429, a 5xx) falls back to Gemini,
#   so pay-as-you-go Vertex's occasional 429 never reaches the client.
routing:
  policies:
    qwen3-235b-a22b-instruct-2507-maas:
      select:
        - router: priority
          candidates:
            - vertex_ai:qwen/qwen3-235b-a22b-instruct-2507-maas
            - vertex_global:gemini-3.1-flash-lite
        - default: vertex_ai:qwen/qwen3-235b-a22b-instruct-2507-maas
      on_failure:
        - vertex_global:gemini-3.1-flash-lite
    overflow-probe:
      select:
        - router: priority
          candidates:
            - vertex_fake:spill-primary
            - vertex_fake:spill-secondary
        - default: vertex_fake:spill-primary
    # check.py's fallback check: a provider that always answers 429, then Gemini.
    throttled-with-fallback:
      select:
        - default: vertex_fake:gemini-2.5-flash-lite-429
      on_failure:
        - vertex_global:gemini-3.1-flash-lite

search_tools:
  exa-search:                     # the name MLPA calls; real
    provider: exa
    api_key: ${EXA_API_KEY}

# MLPA's budgets, one per service type under MLPA's budget id with MLPA's default
# limits (USER_FEATURE_BUDGET_*), with three rig changes:
# - tpm_limit 100000 on ai, memories, sw-answer and agent (MLPA's default is
#   2,000, and a Smart Window chat with page context alone is 2k-10k prompt
#   tokens, so the browser was refused after one message);
# - mochi-dev's max_budget holds one $0.005 request (the fake `per-request`
#   model) and not two, for check.py's budget refusal ({error: 1}). Neither Firefox nor the other checks
#   use mochi-dev;
# - mlpa-global, the global budget ({error: 10}): a daily ceiling in USD on
#   MLPA's key across every end user. check.py lowers it for a moment.
budgets:
  end-user-budget-ai:           {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 40,  tpm_limit: 100000}
  end-user-budget-s2s:          {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 40,  tpm_limit: 2000}
  end-user-budget-s2s-android:  {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 40,  tpm_limit: 2000}
  end-user-budget-memories:     {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 10,  tpm_limit: 100000}
  end-user-budget-search:       {max_budget: 0.01, reset_alignment: calendar_day,  rpm_limit: 10,  tpm_limit: 2000}
  end-user-budget-answer:       {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 10,  tpm_limit: 2000}
  end-user-budget-sw-answer:    {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 10,  tpm_limit: 100000}
  end-user-budget-liner-answer: {max_budget: 0.06, reset_alignment: calendar_day,  rpm_limit: 10,  tpm_limit: 2000}
  end-user-budget-telemetry:    {max_budget: 0.1,  reset_alignment: calendar_day,  rpm_limit: 10,  tpm_limit: 2000}
  end-user-budget-agent:        {max_budget: 0.1,  reset_alignment: calendar_week, rpm_limit: 10,  tpm_limit: 100000}
  end-user-budget-agent-search: {max_budget: 0.1,  reset_alignment: calendar_week, rpm_limit: 10,  tpm_limit: 2000}
  end-user-budget-ai-dev:       {max_budget: 1.0,  reset_alignment: calendar_day,  rpm_limit: 200, tpm_limit: 10000}
  end-user-budget-memories-dev: {max_budget: 1.0,  reset_alignment: calendar_day,  rpm_limit: 50,  tpm_limit: 5000}
  end-user-budget-mochi-dev:    {max_budget: 0.006, reset_alignment: calendar_day, rpm_limit: 200, tpm_limit: 10000}
  end-user-budget-search-dev:   {max_budget: 1.0,  reset_alignment: calendar_day,  rpm_limit: 200, tpm_limit: 10000}
  mlpa-global:                  {max_budget: 100,  reset_alignment: calendar_day}
  # Load tests' own budget: loose enough that the test measures the stack, not
  # the limits.
  # concurrency.py's per-user budget: ten $0.005 requests, and no eleventh.
  concurrency:                  {max_budget: 0.05, reset_alignment: calendar_day,  rpm_limit: 100000, tpm_limit: 100000000}
  loadtest:                     {max_budget: 1000, reset_alignment: calendar_day,  rpm_limit: 100000, tpm_limit: 100000000}

# MLPA's one service key, for every service type. MLPA sends the same secret as
# OTARI_SERVICE_KEY; docker-compose.yml gives both sides MLPA_SERVICE_KEY.
api_keys:
  mlpa:
    secret: ${MLPA_SERVICE_KEY}
    user_id: mlpa
    is_service_key: true
    end_user_budget_ids:
      - end-user-budget-ai
      - end-user-budget-s2s
      - end-user-budget-s2s-android
      - end-user-budget-memories
      - end-user-budget-search
      - end-user-budget-answer
      - end-user-budget-sw-answer
      - end-user-budget-liner-answer
      - end-user-budget-telemetry
      - end-user-budget-agent
      - end-user-budget-agent-search
      - end-user-budget-ai-dev
      - end-user-budget-memories-dev
      - end-user-budget-mochi-dev
      - end-user-budget-search-dev
    end_user_budget_id: end-user-budget-ai
    ceiling: mlpa-global

  # MLPA's load tests, the counterpart of LiteLLM's custom virtual key (MLPA
  # #251, #269): with ALLOW_CUSTOM_VIRTUAL_KEY, MLPA forwards the client's
  # litellm-virtual-key header as the bearer, without naming a budget, so every
  # end user lands on this key's default budget, apart from MLPA's own users.
  # Config can't restrict a key to `mock` yet (allowed_models).
  mlpa-loadtest:
    secret: ${MLPA_LOADTEST_KEY}
    user_id: mlpa-loadtest
    is_service_key: true
    end_user_budget_ids: [loadtest]
    end_user_budget_id: loadtest

  # concurrency.py and reset_watch.py: end users start on `concurrency`, whose cap
  # concurrent requests must not overrun. concurrency.py adds and removes its own
  # ceiling on this key for the global-budget test.
  mlpa-concurrency:
    secret: ${MLPA_CONCURRENCY_KEY}
    user_id: mlpa-concurrency
    is_service_key: true
    end_user_budget_ids: [concurrency]
    end_user_budget_id: concurrency
